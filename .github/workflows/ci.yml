name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate social content
        run: npm run social:check

      - name: Validate executive approval queue
        run: npm run ops:check

      - name: Validate reserve growth plan
        run: npm run ops:reserve-check

      - name: Validate revenue operating plan
        run: npm run ops:revenue-check

      - name: Validate sats generation ledger
        run: npm run ops:sats-check

      - name: Security check
        run: npm run security:check

      - name: Unit tests
        run: npm run test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
