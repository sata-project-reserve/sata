name: SATA Transparency Report

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/transparency-report.yml'
      - '.github/workflows/audit-intake.yml'
      - '.github/ISSUE_TEMPLATE/transparency-audit-intake.yml'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/mainnet/**'
      - 'public/project-profile.json'
      - 'public/executive-approval-queue.json'
      - 'public/reserve-growth-plan.json'
      - 'public/revenue-operating-plan.json'
      - 'public/paid-promotion-ledger.json'
      - 'public/revenue-cycle-status.json'
      - 'public/sats-generation-ledger.json'
      - 'public/sats-invoice-queue.json'
      - 'public/sats-prospect-pipeline.json'
      - 'public/transparency-audit-delivery-kit.json'
      - 'tests/fixtures/transparency-audit-intake-issue.json'
      - 'tests/fixtures/transparency-audit-intake-event.json'
      - 'public/social-agent-profile.json'
      - 'public/social-agent-content-queue.json'
      - 'public/social-agent-monitoring-log.json'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'tsconfig.json'
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sata-transparency-report
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate social content
        run: npm run social:check

      - name: Validate executive approval queue
        run: npm run ops:check

      - name: Validate executive approval plan
        run: npm run ops:approval-plan-check

      - name: Validate approved follow-through
        run: npm run ops:approval-followthrough-check

      - name: Validate revenue autopilot workflow
        run: npm run ops:autopilot-check

      - name: Validate notification tools
        run: npm run ops:notification-check

      - name: Validate reserve growth plan
        run: npm run ops:reserve-check

      - name: Validate revenue operating plan
        run: npm run ops:revenue-check

      - name: Validate paid promotion ledger
        run: npm run ops:paid-promotion-check

      - name: Validate revenue cycle status
        run: npm run ops:cycle-check

      - name: Validate revenue execution brief
        run: npm run ops:execution-brief-check

      - name: Validate revenue attribution
        run: npm run ops:attribution-check

      - name: Validate sats generation ledger
        run: npm run ops:sats-check

      - name: Validate sats target planner
        run: npm run ops:sats-target-check

      - name: Validate sats invoice queue
        run: npm run ops:invoice-check

      - name: Validate sats invoice quoter
        run: npm run ops:invoice-quote-check

      - name: Validate sats invoice requests
        run: npm run ops:invoice-request-check

      - name: Validate sats invoice payment packets
        run: npm run ops:invoice-payment-check

      - name: Validate sats receipt allocation proposals
        run: npm run ops:receipt-check

      - name: Validate sats prospect pipeline
        run: npm run ops:prospect-check

      - name: Validate sats prospect candidates
        run: npm run ops:prospect-candidate-check

      - name: Validate sats prospect review packets
        run: npm run ops:prospect-review-check

      - name: Validate sats prospect stage agent
        run: npm run ops:prospect-stage-check

      - name: Validate sats prospect response agent
        run: npm run ops:prospect-response-check

      - name: Validate sats prospect follow-up agent
        run: npm run ops:prospect-follow-up-check

      - name: Validate sats outreach approval packets
        run: npm run ops:outreach-approval-check

      - name: Validate paid promotion ledger
        run: npm run ops:paid-promotion-check

      - name: Validate prospect intake workflow
        run: npm run ops:prospect-intake-check

      - name: Validate prospect intake commenter
        run: npm run ops:prospect-intake-comment-check

      - name: Validate service outreach packets
        run: npm run ops:outreach-check

      - name: Validate outreach dispatch brief
        run: npm run ops:outreach-dispatch-check

      - name: Validate transparency audit delivery kit
        run: npm run ops:delivery-check

      - name: Validate transparency audit artifact generator
        run: npm run ops:audit-artifact-check

      - name: Validate audit intake workflow
        run: npm run ops:intake-check

      - name: Validate audit intake commenter
        run: npm run ops:intake-comment-check

      - name: Security check
        run: npm run security:check

      - name: Unit tests
        run: npm run test

      - name: Generate transparency report
        run: npm run transparency:report
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
          NEXT_PUBLIC_MAINNET_RPC_URL: ${{ vars.NEXT_PUBLIC_MAINNET_RPC_URL }}
          SATA_PLANNED_RESERVE_SATS: ${{ vars.SATA_PLANNED_RESERVE_SATS }}
          SATA_SIGNATURE_SCAN_LIMIT: ${{ vars.SATA_SIGNATURE_SCAN_LIMIT }}
          SATA_BTC_API_BASE: ${{ vars.SATA_BTC_API_BASE }}
          SATA_BTC_RESERVE_ADDRESS: ${{ vars.SATA_BTC_RESERVE_ADDRESS }}
          SATA_BTC_RESERVE_MESSAGE: ${{ vars.SATA_BTC_RESERVE_MESSAGE }}
          SATA_BTC_RESERVE_SIGNATURE: ${{ vars.SATA_BTC_RESERVE_SIGNATURE }}

      - name: Commit latest public report
        id: report_commit
        run: |
          set -euo pipefail
          git config user.name "sata-report-bot"
          git config user.email "sata-report-bot@users.noreply.github.com"

          base_sha="$(git rev-parse HEAD)"
          git add public/transparency public/revenue-cycle-status.json public/health.json public/sitemap.xml public/robots.txt

          if git diff --cached --quiet; then
            echo "No public report changes to commit."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: publish SATA transparency report"

          if git push origin HEAD:main; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"

          if [ "$remote_sha" != "$base_sha" ]; then
            echo "::notice::Skipped stale report commit because main advanced from ${base_sha} to ${remote_sha} while this job was running."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Failed to push the report commit even though origin/main did not advance."
          echo "deploy=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Build static site
        if: steps.report_commit.outputs.deploy == 'true'
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Upload report artifact
        if: steps.report_commit.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sata-transparency-report
          path: |
            artifacts/transparency/latest.json
            artifacts/transparency/latest.md
            artifacts/transparency/history.json
            artifacts/transparency/history.md
            public/health.json
            public/revenue-cycle-status.json
            public/sitemap.xml
            public/robots.txt

      - name: Configure GitHub Pages
        if: steps.report_commit.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.report_commit.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy GitHub Pages
        if: steps.report_commit.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
