name: Referral Handoff Evidence
description: Submit evidence that approved SATA referral handoff terms were manually sent.
title: '[Referral Handoff Evidence]: '
labels: ['referral-handoff-evidence', 'manual-evidence']
body:
  - type: markdown
    attributes:
      value: |
        Use this form only after approved post-receipt referral handoff terms have been manually sent.

        This form records evidence for review. It does not approve a partner, compensation, invoice, payment instruction, paid work, token grant, public commitment, or asset movement.
  - type: input
    id: campaignId
    attributes:
      label: Source campaign ID
      description: 'Example: diana-crypto-20260903-transparency-tweet'
    validations:
      required: true
  - type: input
    id: partnerHandle
    attributes:
      label: Partner handle
      description: 'Example: 142C_'
    validations:
      required: true
  - type: input
    id: sentEvidenceUrl
    attributes:
      label: Sent evidence URL or reference
      description: Message permalink, email archive reference, screenshot reference, or other durable evidence.
    validations:
      required: true
  - type: input
    id: approvedTermsSha256
    attributes:
      label: Approved terms SHA-256
      description: Copy this from the approved referral handoff packet.
    validations:
      required: true
  - type: textarea
    id: exactTermsSent
    attributes:
      label: Exact referral terms sent
      description: Paste the exact approved referral handoff terms that were sent. Do not include payment instructions or new claims.
    validations:
      required: true
  - type: input
    id: sentAtUtc
    attributes:
      label: Sent at UTC
      description: ISO timestamp when the approved terms were sent.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I sent only the approved post-receipt referral handoff terms.
          required: true
        - label: I did not offer upfront compensation, payment instructions, token grants, or asset movement.
          required: true
        - label: I did not add price, return, buyer, liquidity, investment, market-support, or guaranteed-result claims.
          required: true
